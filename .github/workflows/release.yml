name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Xmx4096m
      RELEASE_TAG: ${{ github.ref_name }}
      SILLYTAVERN_REF: ${{ vars.SILLYTAVERN_REF || 'release' }}
      TERMUX_RELEASE_KEYSTORE_BASE64: ${{ secrets.TERMUX_RELEASE_KEYSTORE_BASE64 }}
      TERMUX_RELEASE_STORE_PASSWORD: ${{ secrets.TERMUX_RELEASE_STORE_PASSWORD }}
      TERMUX_RELEASE_KEY_ALIAS: ${{ secrets.TERMUX_RELEASE_KEY_ALIAS }}
      TERMUX_RELEASE_KEY_PASSWORD: ${{ secrets.TERMUX_RELEASE_KEY_PASSWORD }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 Android SDK 命令行工具
        uses: android-actions/setup-android@v3

      - name: 安装 Android 构建依赖
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: 生成 GitHub runner 用 local.properties
        shell: bash
        working-directory: mobile
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: 授予 Gradle Wrapper 执行权限
        shell: bash
        working-directory: mobile
        run: chmod +x ./gradlew

      - name: 安装构建期依赖
        shell: bash
        run: |
          echo "Node version: $(node --version)"
          npm ci

      - name: 配置 Release 签名 Secrets
        shell: bash
        run: |
          if [ -z "${TERMUX_RELEASE_KEYSTORE_BASE64}" ] || [ -z "${TERMUX_RELEASE_STORE_PASSWORD}" ] || [ -z "${TERMUX_RELEASE_KEY_ALIAS}" ] || [ -z "${TERMUX_RELEASE_KEY_PASSWORD}" ]; then
            echo "缺少 Release 签名 Secrets，请配置 TERMUX_RELEASE_KEYSTORE_BASE64 / TERMUX_RELEASE_STORE_PASSWORD / TERMUX_RELEASE_KEY_ALIAS / TERMUX_RELEASE_KEY_PASSWORD" >&2
            exit 1
          fi
          echo "${TERMUX_RELEASE_KEYSTORE_BASE64}" | base64 --decode > mobile/app/release-ci.keystore
          echo "TERMUX_RELEASE_STORE_FILE=release-ci.keystore" >> "$GITHUB_ENV"
          echo "TERMUX_RELEASE_STORE_PASSWORD=${TERMUX_RELEASE_STORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "TERMUX_RELEASE_KEY_ALIAS=${TERMUX_RELEASE_KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "TERMUX_RELEASE_KEY_PASSWORD=${TERMUX_RELEASE_KEY_PASSWORD}" >> "$GITHUB_ENV"

      - name: 注入版本标签
        shell: bash
        run: |
          VERSION_NAME="${RELEASE_TAG#v}"
          if [[ ! "$VERSION_NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-([A-Za-z0-9]+)\.([0-9]+))?$ ]]; then
            echo "版本标签格式非法：${RELEASE_TAG}，应使用 vMAJOR.MINOR.PATCH 或 vMAJOR.MINOR.PATCH-beta.N" >&2
            exit 1
          fi
          MAJOR=$((10#${BASH_REMATCH[1]}))
          MINOR=$((10#${BASH_REMATCH[2]}))
          PATCH=$((10#${BASH_REMATCH[3]}))
          PRERELEASE_SEQUENCE="${BASH_REMATCH[6]}"
          if [ -n "$PRERELEASE_SEQUENCE" ]; then
            if [ "$PRERELEASE_SEQUENCE" -lt 1 ] || [ "$PRERELEASE_SEQUENCE" -gt 98 ]; then
              echo "预发布序号必须在 1-98 之间：${RELEASE_TAG}" >&2
              exit 1
            fi
            CHANNEL_CODE=$((10#$PRERELEASE_SEQUENCE))
          else
            CHANNEL_CODE=99
          fi
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 10000 + PATCH * 100 + CHANNEL_CODE))
          echo "STAPK_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
          echo "STAPK_VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_ENV"

      - name: 从 CHANGELOG 生成 Release 正文
        shell: bash
        run: |
          mkdir -p release-assets
          python3 <<'PY'
          from pathlib import Path
          import os
          import re
          import sys

          tag = os.environ["RELEASE_TAG"]
          changelog = Path("CHANGELOG.md")
          content = changelog.read_text(encoding="utf-8")

          pattern = re.compile(
              rf"^##\s+{re.escape(tag)}\b.*?(?=^##\s+v|\Z)",
              re.MULTILINE | re.DOTALL,
          )
          match = pattern.search(content)
          if not match:
              print(f"未在 CHANGELOG.md 中找到 {tag} 对应段落", file=sys.stderr)
              sys.exit(1)

          notes_path = Path("release-assets/release-notes.md")
          notes_path.write_text(match.group(0).strip() + "\n", encoding="utf-8")
          print(f"已生成 {notes_path}")
          PY

      - name: 一键验证并构建 Release APK
        shell: bash
        run: npm run build:no-node-apk -- --variant release --ref "$SILLYTAVERN_REF"

      - name: 整理带版本号的发布资产
        shell: bash
        run: |
          APK_NAME="stapk-mobile_${RELEASE_TAG}.apk"
          cp output/stapk-mobile-release.apk "release-assets/${APK_NAME}"
          (
            cd release-assets
            sha256sum "${APK_NAME}" > "${APK_NAME}.sha256"
          )

      - name: 上传 Release APK 与转换证据
        uses: actions/upload-artifact@v4
        with:
          name: stapk-release-${{ github.ref_name }}
          path: |
            release-assets/stapk-mobile_${{ github.ref_name }}.apk
            release-assets/stapk-mobile_${{ github.ref_name }}.apk.sha256
            output/api-contract.json
            output/stapk-capabilities.json
            output/stapk-web-manifest.json
            output/transform-report.json

      - name: 上传 release 资产到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-assets/release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-assets/stapk-mobile_${{ github.ref_name }}.apk
            release-assets/stapk-mobile_${{ github.ref_name }}.apk.sha256
            output/api-contract.json
            output/stapk-capabilities.json
            output/stapk-web-manifest.json
            output/transform-report.json
