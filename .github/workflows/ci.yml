name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: "1"
      JITPACK_NDK_VERSION: "22.1.7171670"
      GRADLE_OPTS: -Xmx4096m
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 安装 Android SDK 命令行工具
        uses: android-actions/setup-android@v3

      - name: 安装 Android 构建依赖
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-30" \
            "build-tools;30.0.3" \
            "ndk;22.1.7171670"

      - name: 生成 GitHub runner 用 local.properties
        shell: bash
        working-directory: upstream/termux-app
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: 执行关键单测
        shell: bash
        working-directory: upstream/termux-app
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest \
            --tests "com.stapk.termux.app.stapk.StapkScriptAssetsTest" \
            --tests "com.stapk.termux.shared.shell.TermuxShellUtilsTest" \
            --tests "com.stapk.termux.app.stapk.StapkBootstrapShebangFixerTest" \
            --tests "com.stapk.termux.app.stapk.StapkRuntimeControllerTest" \
            --tests "com.stapk.termux.app.stapk.StapkStatusSnapshotTest"

      - name: 构建 Debug APK
        shell: bash
        working-directory: upstream/termux-app
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: 上传 arm64 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: stapk-debug-arm64-v8a
          path: |
            upstream/termux-app/app/build/outputs/apk/debug/termux-app_debug_arm64-v8a.apk
            upstream/termux-app/app/build/outputs/apk/debug/output-metadata.json
