name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Xmx4096m
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: 安装 Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 Android SDK 命令行工具
        uses: android-actions/setup-android@v3

      - name: 安装 Android 构建依赖
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: 生成 GitHub runner 用 local.properties
        shell: bash
        working-directory: mobile
        run: |
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: 授予 Gradle Wrapper 执行权限
        shell: bash
        working-directory: mobile
        run: chmod +x ./gradlew

      - name: 安装构建期依赖
        shell: bash
        run: |
          echo "Node version: $(node --version)"
          npm ci

      - name: 一键验证并构建 Debug APK
        shell: bash
        run: npm run build:no-node-apk -- --variant debug --ref release

      - name: 上传 Debug APK 与转换证据
        uses: actions/upload-artifact@v4
        with:
          name: stapk-debug-app
          path: |
            output/stapk-mobile-debug.apk
            output/stapk-mobile-debug.apk.sha256
            output/api-contract.json
            output/stapk-capabilities.json
            output/stapk-web-manifest.json
            output/transform-report.json
